version: 2.1

commands:
  install_node:
    description: "Install pinned Node.js from nodejs.org with SHA256 verification (the legacy circleci/python:3-node image bundles an EOL Node)"
    steps:
      - run:
          name: Install Node.js 24.22.1
          command: |
            NODE_VERSION=24.22.1
            NODE_SHA256=6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
            curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
            echo "${NODE_SHA256}  node-v${NODE_VERSION}-linux-x64.tar.xz" | sha256sum -c -
            sudo tar -xJf "node-v${NODE_VERSION}-linux-x64.tar.xz" -C /usr/local --strip-components=1
            rm "node-v${NODE_VERSION}-linux-x64.tar.xz"
            node --version | grep -qx "v${NODE_VERSION}"
            npm install -g yarn
  pull_submodules:
    steps:
      - run:
          name: Pull submodules
          command: git submodule init && git submodule update
  install_dependencies:
    steps:
      - restore_cache:
          name: Restore modules cache
          keys:
            - node_modules-{{ checksum "yarn.lock" }}-{{ checksum "requirements-dev.txt" }}
      - run:
          name: Install Dependencies
          command: |
            yarn install --frozen-lockfile
            pip3 install -U pip setuptools virtualenv
            python3 -m venv venv
            source venv/bin/activate
            pip3 install -r requirements-dev.txt
      - save_cache:
          name: Save modules cache
          key: node_modules-{{ checksum "yarn.lock" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ./node_modules
            - ./venv

jobs:
  setup:
    docker:
      - image: circleci/python:3-node
    steps:
      - install_node
      - checkout
      - setup_remote_docker
      - pull_submodules
      - install_dependencies
      - persist_to_workspace:
          root: .
          paths:
            - .
  build:
    docker:
      - image: circleci/python:3-node
    steps:
      - install_node
      - attach_workspace:
          at: .
      - run: yarn build
      - run: yarn typecheck
      - run: yarn workspace @trusttoken-smart-contracts/contracts-por build
      - persist_to_workspace:
          root: .
          paths:
            - .
  slither:
    docker:
      - image: circleci/python:3-node
    steps:
      - install_node
      - attach_workspace:
          at: .
      - run: ./slither.sh
  lint:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn lint
  lint-package-contracts-por:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn workspace @trusttoken-smart-contracts/contracts-por lint
  test-package-contracts-por:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn workspace @trusttoken-smart-contracts/contracts-por test
  test-others:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn test:governance
      - run: yarn test:proxy
      - run: yarn test:registry
      - run: yarn test:scripts
      - run: yarn test:true-currencies
      - run: yarn test:true-gold
      - run: yarn test:trusttoken
  test-truefi:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn test:truefi
  test-truefi2:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn test:truefi2
  test-lines-of-credit:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn test:lines-of-credit
  test-complete-flow:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn test:complete-flow
  deploy:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn deploy:dryrun
  integration:
    docker:
      - image: cimg/node:24.22.1
    steps:
      - attach_workspace:
          at: .
      - run: yarn test:integration --config .mocharc.integration-ci.js

workflows:
  version: 2
  test:
    jobs:
      - setup
      - build:
          requires:
            - setup
      - lint:
          requires:
            - setup
      - lint-package-contracts-por:
          requires:
            - build
      - test-package-contracts-por:
          requires:
            - build
      - test-truefi:
          requires:
            - build
      - test-truefi2:
          requires:
            - build
      - test-lines-of-credit:
          requires:
            - build
      - test-complete-flow:
          requires:
            - build
      - test-others:
          requires:
            - build
      - deploy:
          requires:
            - build
      - integration:
          context: main
          requires:
            - build

