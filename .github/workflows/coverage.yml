name: Test Coveralls
on:
  schedule:
    - cron: "0 4 * * *"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: yarn
        run: yarn
      - name: build
        run: yarn build
      - name: coverage
        run: yarn coverage
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
